
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balloon Pop - MoveSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background:#f2f6ff; text-align:center; }
        #balloon { font-size:100px; border:0; background:transparent;
                   cursor:pointer; margin:35px; }
    </style>
</head>
<body class="container py-5">
    <h1>🎈 Balloon Pop</h1>
    <p>Click the balloon as many times as you can in 20 seconds!</p>
    <h3>Time: <span id="time">20</span>s</h3>
    <h3>Score: <span id="score">0</span></h3>
    <button id="balloon" onclick="popBalloon()" disabled>🎈</button>
    <br>
    <button id="start" class="btn btn-primary" onclick="startGame()">Start Game</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Dashboard</a>
    <p id="message" class="mt-3 fw-bold"></p>

<script>
let score=0, time=20, timer=null, running=false, started=0;

function startGame() {
    clearInterval(timer);
    score=0; time=20; running=true; started=Date.now();

    document.getElementById("score").textContent=score;
    document.getElementById("time").textContent=time;
    document.getElementById("message").textContent="";
    document.getElementById("balloon").disabled=false;
    document.getElementById("start").disabled=true;

    timer=setInterval(()=>{
        time--;
        document.getElementById("time").textContent=time;
        if(time<=0) endGame();
    },1000);
}

function popBalloon() {
    if(!running) return;
    score++;
    document.getElementById("score").textContent=score;
    document.getElementById("balloon").textContent=
        ["🎈","🎈","🎈","🎉"][Math.floor(Math.random()*4)];
}

function endGame() {
    running=false;
    clearInterval(timer);
    document.getElementById("balloon").disabled=true;
    document.getElementById("start").disabled=false;
    document.getElementById("message").textContent=
        "Time's up! You popped "+score+" balloons.";

    fetch("/save_game_result", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            game_name:"Balloon Pop",
            score:Math.min(100,score*5),
            accuracy:0,
            reaction_time:0,
            completion_time:Math.round((Date.now()-started)/1000),
            errors:0,
            objects_caught:score,
            objects_missed:0,
            path_deviation:0
        })
    }).catch(()=>{});
}
</script>
</body>
</html>
