
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Path Tracer - MoveSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background:#f2f6ff; text-align:center; }
        canvas { background:white; border:2px solid #333; touch-action:none;
                 max-width:100%; }
    </style>
</head>
<body class="container py-4">
    <h1>✏️ Path Tracer</h1>
    <p>Trace the path from the green start to the red finish.</p>
    <canvas id="canvas" width="320" height="320"></canvas>
    <p id="message" class="fw-bold mt-2"></p>
    <button class="btn btn-primary" onclick="resetGame()">Restart</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Dashboard</a>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let drawing=false, started=Date.now(), points=[], done=false;

function drawBoard() {
    ctx.clearRect(0,0,320,320);
    ctx.lineWidth=30;
    ctx.lineCap="round";
    ctx.strokeStyle="#dbeafe";
    ctx.beginPath();
    ctx.moveTo(40,40);
    ctx.lineTo(40,150);
    ctx.lineTo(160,150);
    ctx.lineTo(160,270);
    ctx.lineTo(280,270);
    ctx.stroke();

    ctx.fillStyle="green";
    ctx.beginPath(); ctx.arc(40,40,15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="red";
    ctx.beginPath(); ctx.arc(280,270,15,0,Math.PI*2); ctx.fill();
}

function position(e) {
    const rect=canvas.getBoundingClientRect();
    return {
        x:(e.clientX-rect.left)*canvas.width/rect.width,
        y:(e.clientY-rect.top)*canvas.height/rect.height
    };
}

canvas.addEventListener("pointerdown",e=>{
    if(done) return;
    const p=position(e);
    if(Math.hypot(p.x-40,p.y-40)<25) {
        drawing=true;
        points=[p];
        started=Date.now();
        canvas.setPointerCapture(e.pointerId);
    }
});

canvas.addEventListener("pointermove",e=>{
    if(!drawing || done) return;
    const p=position(e);
    points.push(p);
    ctx.strokeStyle="#2563eb";
    ctx.lineWidth=5;
    ctx.lineCap="round";
    const prev=points[points.length-2];
    ctx.beginPath();
    ctx.moveTo(prev.x,prev.y);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();

    if(Math.hypot(p.x-280,p.y-270)<20) finishGame();
});

canvas.addEventListener("pointerup",()=>{drawing=false;});

function finishGame() {
    if(done) return;
    done=true; drawing=false;

    document.getElementById("message").textContent=
        "Well done! You reached the finish.";

    fetch("/save_game_result", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            game_name:"Path Tracer",
            score:100,
            accuracy:100,
            reaction_time:0,
            completion_time:Math.round((Date.now()-started)/1000),
            errors:0,
            objects_caught:0,
            objects_missed:0,
            path_deviation:0
        })
    }).catch(()=>{});
}

function resetGame() {
    drawing=false;
    done=false;
    points=[];
    started=Date.now();
    document.getElementById("message").textContent="";
    drawBoard();
}

drawBoard();
</script>
</body>
</html>
