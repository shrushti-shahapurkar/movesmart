
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shape Matcher - MoveSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        body { background:#f2f6ff; text-align:center; }
        .shape { font-size:65px; margin:10px; }
        button { margin:8px; }
    </style>
</head>
<body class="container py-5">
    <h1>🔷 Shape Matcher</h1>
    <p>Choose the shape that matches the target.</p>
    <h2 id="target" class="shape"></h2>
    <div id="options"></div>
    <p id="message" class="fw-bold"></p>
    <p>Score: <span id="score">0</span> |
       Questions: <span id="question">0</span>/5</p>
    <button class="btn btn-success" onclick="startGame()">Restart</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Dashboard</a>

<script>
const shapes = ["🔵","🔺","🟩","⭐","❤️"];
let score=0, question=0, answer="", errors=0, started=0;

function startGame() {
    score=0; question=0; errors=0;
    document.getElementById("message").textContent="";
    nextQuestion();
}

function nextQuestion() {
    if (question===5) {
        document.getElementById("target").textContent="🎉 Finished!";
        document.getElementById("options").innerHTML="";
        document.getElementById("message").textContent=
            "Game complete! Your score is "+score+" out of 5.";

        fetch("/save_game_result", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                game_name:"Shape Matcher",
                score:score*20,
                accuracy:score/5*100,
                reaction_time:0,
                completion_time:Math.round((Date.now()-started)/1000),
                errors:errors,
                objects_caught:0,
                objects_missed:0,
                path_deviation:0
            })
        }).catch(()=>{});
        return;
    }

    question++;
    answer=shapes[Math.floor(Math.random()*shapes.length)];
    document.getElementById("target").textContent=answer;
    document.getElementById("question").textContent=question;

    const choices=[answer];
    while(choices.length<3) {
        const s=shapes[Math.floor(Math.random()*shapes.length)];
        if(!choices.includes(s)) choices.push(s);
    }

    choices.sort(()=>Math.random()-0.5);
    const box=document.getElementById("options");
    box.innerHTML="";

    choices.forEach(shape=>{
        const btn=document.createElement("button");
        btn.className="btn btn-light border shape";
        btn.textContent=shape;
        btn.onclick=()=>{
            if(shape===answer) {
                score++;
                document.getElementById("message").textContent="Correct! ⭐";
            } else {
                errors++;
                document.getElementById("message").textContent="Try the next one!";
            }
            document.getElementById("score").textContent=score;
            box.querySelectorAll("button").forEach(b=>b.disabled=true);
            setTimeout(nextQuestion,700);
        };
        box.appendChild(btn);
    });
}

started=Date.now();
startGame();
</script>
</body>
</html>
